amily="Georgia, Times New Roman, serif" font-size="23" fill="#435f71" >Transportation knowledge shapes the features,</text><text x="48" y="458" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#435f71" >training objective, and model architecture.</text></svg>
