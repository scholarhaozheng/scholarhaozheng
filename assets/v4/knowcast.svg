<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">KNOWCAST — knowledge-integrated metro forecasting</title><desc id="desc">A condensed redrawing of the encoder–decoder in the paper's Figure 3. Historical OD and knowledge enter encoder KITP units. The final encoder hidden state initializes the decoder. The first decoder receives a zero OD input; subsequent decoder steps receive predicted OD during inference. Future knowledge enters the decoder at each step. Hidden state is passed between recurrent units.</desc><defs><marker id="arrow-navy" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1L6 3.5L1 6" fill="none" stroke="#5f7b89" stroke-width="1.3"/></marker><marker id="arrow-teal" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1L6 3.5L1 6" fill="none" stroke="#277c7d" stroke-width="1.3"/></marker></defs><rect x=".75" y=".75" width="1198.5" height="478.5" rx="16" fill="#f4f8fa" stroke="#d5e1e9" stroke-width="1.5"/><text x="48" y="48" font-family="Georgia, Times New Roman, serif" font-size="17" fill="#617989" letter-spacing=".7">01 / KNOWLEDGE-INTEGRATED LEARNING</text><text x="45" y="142" font-family="Georgia, Times New Roman, serif" font-size="62" fill="#16344b" >KNOWCAST</text><text x="48" y="197" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#435f71" >Metro OD forecasting</text><text x="48" y="234" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#435f71" >&amp; path-flow estimation</text><path d="M48 285H455" fill="none" stroke="#cedce4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="48" y="324" font-family="Georgia, Times New Roman, serif" font-size="23" fill="#1f4e79" >TRC · 2026</text><text x="48" y="357" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#617989" >Paper &amp; pseudocode</text><path d="M500 40V370" fill="no