<svg xmlns="http://www.w3.org/2000/svg" width="600" height="820" viewBox="0 0 600 820" role="img" aria-labelledby="title desc"><title id="title">Customized shuttle transit</title><desc id="desc">Customized shuttle transit, published in Information in 2021. Route planning for spatiotemporally uneven demand, with optional passenger transfers and ALNS–Tabu Search. The illustration is a simplified adaptation of Figure 1 of Zheng, Zhang and Chen, DOI 10.3390/info12100429. It preserves the source’s direct route, shared starting and ending depots for two shown services, a separate vehicle route through the transfer point, pickup circles, dropoff squares, and travel directions. Locations and repeated intermediate stops are condensed for display; no geographical map or numerical result is implied.</desc><defs><marker id="navy" viewBox="0 0 10 10" refX="8.1" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#16344b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8.1" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#328d87"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8.1" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#b28c54"/></marker></defs><rect x=".75" y=".75" width="598.5" height="818.5" rx="16" fill="#f4f8f7" stroke="#d5e1e9" stroke-width="1.5"/><text x="34" y="48" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#617989" letter-spacing=".7">05 / CUSTOMIZED TRANSIT</text><text x="31" y="121" font-family="Georgia, Times New Roman, serif" font-size="60" fill="#16344b" >Customized</text><text x="31" y="190" font-family="Georgia, Times New Roman, serif" font-size="60" fill="#16344b" >shuttle transit</text><text x="34" y="244" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#435f71" >Demand-responsive routing</text><text x="34" y="282" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#435f71" >&amp; passenger transfers</text><text x="34" y="328" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#617989" >Published · Information · 2021</text><path d="M34 351H566" fill="none" stroke="#d6e3e9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(34 366) scale(.858)"><g aria-label="Simplified service routes adapted from Figure 1: a direct service bypasses transfer; two other vehicle routes meet at an optional transfer point. Circles are pickup nodes and squares are dropoff nodes.">
