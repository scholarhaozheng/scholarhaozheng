<svg xmlns="http://www.w3.org/2000/svg" width="600" height="366" viewBox="0 0 600 366" role="img"><title>Research in transportation systems. M.S., Tsinghua University; Research Assistant, Beijing Jiaotong University.</title><style>text{font-family:Georgia, Times New Roman, serif}.body{fill:#435f71}.title{fill:#16344b}.muted{fill:#617989}.rule{stroke:#d5e1e9;stroke-width:1}@media(prefers-color-scheme:dark){.body{fill:#bacbd8}.title{fill:#e5edf3}.muted{fill:#8fa9ba}.rule{stroke:#30495b}}</style><text x="2" y="34" font-size="29" font-weight="400" class="body">I develop computational methods for</text><text x="2" y="76" font-size="29" font-weight="400" class="body">transportation systems, connecting mobility</text><text x="2" y="118" font-size="29" font-weight="400" class="body">data, transportation knowledge, and network</text><text x="2" y="160" font-size="29" font-weight="400" class="body">optimization for prediction</text><text x="2" y="202" font-size="29" font-weight="400" class="body">and decision-making.</text><text x="2" y="269" font-size="29" font-weight="400" class="title">M.S., Tsinghua University</text><text x="2" y="311" font-size="29" font-weight="400" class="title">Research Assistant,</text><text x="2" y="352" font-size="29" font-weight="400" class="title">Beijing Jiaotong University</text></svg>
