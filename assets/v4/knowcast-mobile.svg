ke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="60" y="316" width="88" height="32" rx="6" fill="#ffffff" stroke="#aed0c5" stroke-width="1.4"/><text x="104" y="339" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#277c7d" text-anchor="middle">ODₜ</text><path d="M421 287V312" fill="none" stroke="#277c7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="377" y="316" width="88" height="32" rx="6" fill="#ffffff" stroke="#aed0c5" stroke-width="1.4"/><text x="421" y="339" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#277c7d" text-anchor="middle">ODₜ₊₁</text><path d="M150 332H323V280H344" fill="none" stroke="#277c7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="258" y="372" font-family="Georgia, Times New Roman, serif" font-size="19" fill="#527c77" text-anchor="middle">Prediction feedback · inference</text></g><path d="M34 686H566" fill="none" stroke="#cedce4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="34" y="726" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#435f71" >Transportation knowledge shapes</text><text x="34" y="761" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#435f71" >features, training objectives,</text><text x="34" y="796" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#435f71" >and the model architecture.</text></svg>
